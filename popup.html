<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Coreply</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <div class="popup">
    <div class="top">
      <span class="logo">⚡ Coreply</span>
      <span class="ver">v1.0</span>
    </div>

    <div class="status-row">
      <span class="dot" id="dot"></span>
      <span id="statusTxt">Checking…</span>
    </div>

    <div class="btns">
      <button id="openSettings">⚙️ Settings</button>
      <button id="getKey" class="outline">Get Free API Key</button>
    </div>

    <p class="note">Works on X (Twitter)</p>
  </div>
  <script src="popup.js"></script>
</body>
</html>
